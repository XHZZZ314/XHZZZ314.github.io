<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#3a1010"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d2b"/>
      <stop offset="1" stop-color="#7a0d18"/>
    </linearGradient>
  </defs>
  <rect width="720" height="720" fill="url(#bg)"/>
  <g opacity="0.10">
    <circle cx="360" cy="360" r="280" fill="#ffffff"/>
  </g>
  <g transform="rotate(-32 360 360)">
    <rect x="-80" y="280" width="880" height="160" rx="12" fill="url(#bar)"/>
    <rect x="-80" y="280" width="880" height="160" rx="12" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.85"/>
  </g>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="360" y="350" font-size="64" font-weight="900" fill="#fff" letter-spacing="4">你不是真的爱跳舞</text>
    <text x="360" y="410" font-size="28" font-weight="700" fill="#ffd2d2" letter-spacing="6">NOT A REAL DANCER</text>
  </g>
  <g stroke="#ffb4b4" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="80" y1="80" x2="150" y2="150"/>
    <line x1="150" y1="80" x2="80" y2="150"/>
    <line x1="570" y1="570" x2="640" y2="640"/>
    <line x1="640" y1="570" x2="570" y2="640"/>
  </g>
</svg>